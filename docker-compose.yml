services:
  userdb:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: usermanagement
    ports:
      - "5432:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data
  
  taskdb:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: taskmanagement
    ports:
      - "5433:5432"
    volumes:
      - taskdb_data:/var/lib/postgresql/data
  

volumes:
  userdb_data:
  taskdb_data:
